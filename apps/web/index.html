<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1017" />
    <meta name="description" content="A private, considered home for event photography." />
    <script>
      (() => {
        try {
          const saved = JSON.parse(localStorage.getItem('trizen-theme') || '{}')?.state?.preference || 'system';
          const resolved = saved === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : saved;
          document.documentElement.dataset.theme = resolved;
        } catch (_) {}
      })();
    </script>
    <title>Arc & Grain — Event photography, delivered</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
