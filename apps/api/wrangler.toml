name = "photos-api"
main = "src/index.ts"
compatibility_date = "2024-12-05"
compatibility_flags = ["nodejs_compat"]

# Development uses Vite. Production serves the SPA and API from one Worker.

[vars]
DOCS_ENABLED = "true"
PUBLIC_ORIGIN = "http://localhost:5173"

[triggers]
crons = ["*/30 * * * *"]

[observability]
enabled = true

[env.production]
name = "photos-api"
workers_dev = true
vars = { DOCS_ENABLED = "false", PUBLIC_ORIGIN = "" }

[env.production.assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/img/*", "/health", "/ready", "/docs", "/redoc", "/openapi.json"]
