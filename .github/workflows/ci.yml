name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.3.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm gen:api
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Start isolated Supabase for workflow tests
        run: pnpm supabase:start
      - run: pnpm env:local
      - run: pnpm test:integration
      - name: Generated client and spec are current
        run: git diff --exit-code -- docs/openapi.json packages/api-client/src
      - name: Public gallery must not import Ant Design
        run: '! grep -R "from .antd" apps/web/src/routes/gallery'

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_STORAGE_BUCKET: ${{ secrets.SUPABASE_STORAGE_BUCKET }}
      CURSOR_SECRET: ${{ secrets.CURSOR_SECRET }}
      PIN_PEPPER: ${{ secrets.PIN_PEPPER }}
      IP_HASH_PEPPER: ${{ secrets.IP_HASH_PEPPER }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.3.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Migrate and deploy frontend plus API to one Worker
        run: pnpm deploy
